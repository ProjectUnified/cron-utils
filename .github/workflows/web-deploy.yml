name: Deploy Web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gitfile
        run: pip install "git+https://github.com/ProjectUnified/GitFile.git"
      - name: Sync upstream sources
        run: gitfile sync

      - name: Build web module
        run: mvn -pl cron-utils-web -am clean package

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cron-utils-web/target/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
