name: Deploy Web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install quilt
        run: sudo apt-get update && sudo apt-get install -y quilt
      - name: Sync upstream sources
        run: bash scripts/sync-upstream.sh

      - name: Build web module
        run: mvn -pl cron-utils-web -am clean package

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cron-utils-web/target/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
